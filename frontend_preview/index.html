<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchutzMachine — Tela de Pilotagem Polo Track EA211 (480×272)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    .case-shell {
      background: linear-gradient(160deg, #1d1f23 0%, #0d0e11 52%, #07080a 100%);
      border: 2.5px solid #f90000;
      box-shadow:
        0 0 0 2px #131518,
        0 14px 34px rgba(0, 0, 0, 0.72),
        0 0 18px rgba(249, 0, 0, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.14);
      border-radius: 22px;
    }
    .bezel-visor {
      background: #040406;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.95);
      border-radius: 13px;
    }
    .led-5mm {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #363940 0%, #14161a 68%, #090a0c 100%);
      border: 1px solid #262930;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.85);
      transition: background 0.035s, box-shadow 0.035s;
    }
    .led-on-green {
      background: radial-gradient(circle at 35% 32%, #e6ffea 0%, #1aff4c 45%, #057a1f 100%);
      border-color: #66ff88;
      box-shadow: 0 0 10px #1aff4c, 0 0 22px rgba(26, 255, 76, 0.65);
    }
    .led-on-red {
      background: radial-gradient(circle at 35% 32%, #ffd6d6 0%, #f90000 45%, #8a0000 100%);
      border-color: #ff5555;
      box-shadow: 0 0 12px #f90000, 0 0 24px rgba(249, 0, 0, 0.75);
    }
    .led-on-blue {
      background: radial-gradient(circle at 35% 32%, #d9eeff 0%, #0088ff 45%, #003e8a 100%);
      border-color: #66b8ff;
      box-shadow: 0 0 12px #0088ff, 0 0 24px rgba(0, 136, 255, 0.75);
    }
    .screen-480x272 {
      width: 480px;
      height: 272px;
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      border: 1px solid #1e2026;
      background: #000000;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-2 flex flex-col items-center gap-2.5">

    <!-- CARCAÇA FT600 SCHUTZMACHINE + 10 LEDs 5mm + TELA EXATA 480x272 -->
    <div class="case-shell px-4 pt-2.5 pb-2 w-fit">
      <div class="bezel-visor px-3 pt-2 pb-1.5 flex flex-col items-center gap-1.5">

        <!-- 10 LEDs FÍSICOS 5mm (4 Verde · 3 Vermelho · 3 Azul) -->
        <div id="ledBar" class="flex items-center justify-center gap-2.5 h-5"></div>

        <!-- TELA IPS 4.3" EXATA: 480 x 272 px -->
        <div class="screen-480x272">
          <canvas id="dashCanvas" width="480" height="272" class="block w-[480px] h-[272px] cursor-pointer"></canvas>
          <!-- Logo vetorial oficial SchutzMachine dentro da tela (topo centro-direito, acima da curva) -->
          <img
            src="./SchutzMachine_color.svg"
            alt="SchutzMachine"
            class="pointer-events-none absolute top-[6px] left-[228px] h-[16px] w-auto opacity-95 drop-shadow-[0_1px_4px_rgba(0,0,0,0.9)]"
            onerror="this.style.display='none'"
          />
        </div>

        <!-- MOLDURA INFERIOR COM LOGO OFICIAL SCHUTZMACHINE -->
        <div class="flex items-center justify-between w-full px-1 pt-0.5">
          <span class="text-[9px] font-bold tracking-[0.2em] text-neutral-500 uppercase italic">MQB A0 · EA211</span>
          <img
            src="./SchutzMachine_color.svg"
            alt="SchutzMachine"
            class="h-[13px] w-auto opacity-90"
            onerror="this.outerHTML='<span class=&quot;italic font-black tracking-[0.12em] text-[12px] text-[#f5f5f5]&quot;>SCHUTZ<span class=&quot;text-[#f90000]&quot;>MACHINE</span></span>'"
          />
          <span class="text-[9px] font-bold tracking-[0.16em] text-neutral-500 uppercase italic">480×272</span>
        </div>
      </div>
    </div>

    <!-- CONTROLES DE TESTE DA TELEMETRIA -->
    <div class="w-full max-w-[540px] flex flex-wrap items-center justify-between gap-2 px-1 pt-1 border-t border-[var(--card-border)] text-xs">
      <div class="flex items-center gap-1.5">
        <button id="btnSim" class="px-2.5 py-1 rounded font-bold bg-[#f90000] text-white hover:opacity-90 transition cursor-pointer">
          ▶ Puxada 0–100
        </button>
        <button id="btnMode" class="px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] transition cursor-pointer font-bold">
          SPORT
        </button>
        <button id="btnWarn" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] transition cursor-pointer" title="Simular alerta de temperatura alta e reserva">
          Testar Alertas
        </button>
      </div>

      <div class="flex items-center gap-2">
        <label class="flex items-center gap-1.5 text-[var(--muted-foreground)]">
          <span class="font-bold">RPM</span>
          <input id="rpmSlider" type="range" min="850" max="6800" step="25" value="4200" class="w-28 accent-[#f90000] cursor-pointer" />
        </label>
        <select id="gearSelect" class="px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-bold cursor-pointer">
          <option value="0">N</option>
          <option value="1">1ª</option>
          <option value="2">2ª</option>
          <option value="3" selected>3ª</option>
          <option value="4">4ª</option>
          <option value="5">5ª</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // TELEMETRIA REAL DO VW POLO TRACK 2026 (EA211 1.0 MPI / MQ200 5 MARCHAS)
    // Todos os dados abaixo vêm dos PIDs reais OBD2 Mode 0x01 a 500 kbps:
    // 0x0C RPM | 0x0D Veloc. | 0x05 T.Água | 0x0B MAP | 0x11 TPS | 0x04 Carga
    // 0x0E Avanço | 0x0F T.Ar | 0x42 Bateria | 0x2F Tanque | Marcha = RPM/Vel
    // =========================================================================
    const MQ200_RATIOS = { 1: 128.0, 2: 71.5, 3: 48.2, 4: 35.8, 5: 28.6 };
    const FONT_NUM = "'Arial Narrow', 'Impact', 'Segoe UI', Arial, sans-serif";
    const FONT_UI  = "'Segoe UI', Arial, sans-serif";

    const state = {
      rpm: 4200,
      peakRpm: 4200,
      peakHold: 0,
      gear: 3,
      speed: 87,
      tps: 68,          // PID 0x11 / 0x49
      load: 74,         // PID 0x04 (Carga calculada do motor)
      coolant: 91.2,    // PID 0x05 (Temp. real sem filtro de 90°C)
      iat: 38.4,        // PID 0x0F (Temp. ar admissão)
      mapBar: -0.14,    // PID 0x0B (Pressão relativa coletor aspirado)
      ignDeg: 25.5,     // PID 0x0E (Avanço de ignição)
      batV: 14.2,       // PID 0x42 (Tensão bateria/módulo)
      fuelPct: 72,      // PID 0x2F (Nível do tanque)
      tripKm: 43.8,     // Odômetro parcial integrado por velocidade
      timer0100: 0.0,   // Cronômetro 0-100 km/h
      best0100: 13.4,
      mode: 'SPORT',    // SPORT | ECO
      simRunning: false,
      warnTest: false,
      flash: false
    };

    // 10 LEDs 5mm físicos no topo (4 Verde, 3 Vermelho, 3 Azul)
    const ledBar = document.getElementById('ledBar');
    const ledColors = ['green','green','green','green','red','red','red','blue','blue','blue'];
    const ledArchY  = [3, 1.5, 0.5, 0, 0, 0, 0, 0.5, 1.5, 3];
    const ledEls = ledColors.map((c, i) => {
      const el = document.createElement('div');
      el.className = 'led-5mm';
      el.style.transform = `translateY(${ledArchY[i]}px)`;
      ledBar.appendChild(el);
      return el;
    });

    const canvas = document.getElementById('dashCanvas');
    const ctx = canvas.getContext('2d');
    const rpmSlider = document.getElementById('rpmSlider');
    const gearSelect = document.getElementById('gearSelect');
    const btnSim = document.getElementById('btnSim');
    const btnMode = document.getElementById('btnMode');
    const btnWarn = document.getElementById('btnWarn');

    function updateTelemetry() {
      const ratio = MQ200_RATIOS[state.gear];
      state.speed = state.gear === 0 ? 0 : Math.max(0, Math.round(state.rpm / ratio));
      const norm = Math.max(0, (state.rpm - 850) / (6800 - 850));

      state.tps = Math.min(100, Math.round(10 + norm * 90));
      state.load = Math.min(99, Math.round(16 + norm * 83));
      state.mapBar = Number((-0.68 + norm * 0.67).toFixed(2));
      state.ignDeg = Number((6.5 + norm * 25.0).toFixed(1));
      state.coolant = state.warnTest ? 107.8 : Number((88.5 + norm * 4.6).toFixed(1));
      state.iat = Number((33.0 + norm * 8.2).toFixed(1));
      state.batV = state.warnTest ? 11.9 : (state.rpm > 1050 ? 14.2 : 13.7);
      state.fuelPct = state.warnTest ? 12 : 72;

      if (state.rpm >= state.peakRpm) {
        state.peakRpm = state.rpm;
        state.peakHold = 32;
      } else if (state.peakHold > 0) {
        state.peakHold--;
      } else {
        state.peakRpm = Math.max(state.rpm, state.peakRpm - 70);
      }
    }

    function updateLeds() {
      let lit = 0;
      if (state.mode === 'SPORT') {
        if (state.rpm >= 6450) lit = state.flash ? 10 : 0;
        else if (state.rpm >= 4500) lit = Math.min(10, Math.ceil(((state.rpm - 4500) / 1950) * 10));
      } else {
        if (state.rpm >= 3000) lit = state.flash ? 4 : 0;
        else if (state.rpm >= 2200) lit = Math.min(4, Math.ceil(((state.rpm - 2200) / 800) * 4));
      }
      ledEls.forEach((el, i) => {
        el.className = 'led-5mm';
        if (i < lit) el.classList.add('led-on-' + ledColors[i]);
      });
    }

    function drawVertBar(x, y, w, h, title, valStr, pct, color, marks) {
      // Título + valor numérico exato no topo da coluna
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText(title, x, y - 5);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#f5f5f5';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText(valStr, x + w, y - 5);

      // Fundo da coluna
      ctx.fillStyle = '#1e2025';
      ctx.fillRect(x, y, w, h);

      // Preenchimento ativo
      const fh = Math.max(3, h * Math.min(1, Math.max(0, pct)));
      ctx.fillStyle = color;
      ctx.fillRect(x, y + h - fh, w, fh);

      // Borda sutil lateral estilo FT600
      ctx.strokeStyle = '#333740';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

      // Graduações horizontais internas
      ctx.textAlign = 'center';
      ctx.font = `bold 9.5px ${FONT_UI}`;
      marks.forEach((m, idx) => {
        const frac = (idx + 1) / (marks.length + 1);
        const my = y + h - frac * h;
        ctx.strokeStyle = 'rgba(0,0,0,0.65)';
        ctx.beginPath(); ctx.moveTo(x + 3, my); ctx.lineTo(x + w - 3, my); ctx.stroke();

        const filledHere = (h * pct) >= (frac * h - 6);
        ctx.fillStyle = filledHere ? '#000000' : '#8a92a0';
        ctx.fillText(m, x + w / 2, my + 10);
      });
    }

    function drawDashboard() {
      const W = 480, H = 272;
      const isPeak = (state.mode === 'SPORT' && state.rpm >= 6450);
      const isHot = state.coolant >= 104;
      const isLowBat = state.batV < 12.2;
      const isLowFuel = state.fuelPct <= 15;

      // Fundo preto absoluto puro
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Flash vermelho nas bordas no pico de troca (6450 RPM)
      if (isPeak && state.flash) {
        ctx.fillStyle = 'rgba(249, 0, 0, 0.22)';
        ctx.fillRect(0, 0, W, H);
      }

      // =======================================================================
      // ZONA 1: TOPO — CURVA DE RPM FT600 + RPM NUMÉRICO + REC/MODO + LOGO SVG
      // =======================================================================
      const rpmBaseY = 66;
      const curveY = (xFrac) => {
        const h = 15 + Math.pow(xFrac, 1.95) * 44;
        return rpmBaseY - h;
      };

      // Trilha cinza escura da rampa
      ctx.beginPath();
      ctx.moveTo(0, rpmBaseY);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, curveY(x / W));
      ctx.lineTo(W, rpmBaseY);
      ctx.closePath();
      ctx.fillStyle = '#222429';
      ctx.fill();

      // Preenchimento ativo em gradiente quente (Amarelo -> Laranja -> Vermelho Schutz)
      const fillW = Math.min(1, state.rpm / 7000) * W;
      const ftGrad = ctx.createLinearGradient(0, 0, W, 0);
      ftGrad.addColorStop(0.0, '#ffe600');
      ftGrad.addColorStop(0.52, '#ff8800');
      ftGrad.addColorStop(0.82, '#ff2600');
      ftGrad.addColorStop(1.0, '#f90000');

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, fillW, rpmBaseY);
      ctx.clip();
      ctx.beginPath();
      ctx.moveTo(0, rpmBaseY);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, curveY(x / W));
      ctx.lineTo(W, rpmBaseY);
      ctx.closePath();
      ctx.fillStyle = (isPeak && state.flash) ? '#ffffff' : ftGrad;
      ctx.fill();
      ctx.restore();

      // Marcador fino de Peak-Hold na barra
      if (state.peakRpm > state.rpm + 120) {
        const px = Math.min(W - 3, (state.peakRpm / 7000) * W);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(px, curveY(px / W), 2.5, rpmBaseY - curveY(px / W));
      }

      // RPM Numérico limpo (sem colisão entre número e 'RPM'!)
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.font = `italic 900 42px ${FONT_NUM}`;
      ctx.fillText(String(Math.round(state.rpm)), 108, 42);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#9aa3b2';
      ctx.font = `italic 800 12px ${FONT_UI}`;
      ctx.fillText('RPM', 114, 41);

      // Badge SPORT/ECO + indicador REC (sem encostar na logo!)
      const badgeCol = state.mode === 'SPORT' ? '#f90000' : '#18e04b';
      ctx.fillStyle = badgeCol;
      ctx.fillRect(154, 10, 56, 15);
      ctx.textAlign = 'center';
      ctx.fillStyle = state.mode === 'SPORT' ? '#ffffff' : '#000000';
      ctx.font = `italic 900 10px ${FONT_UI}`;
      ctx.fillText(state.mode, 182, 21);

      // Escala 1..7 perfeitamente alinhada sob a curva
      ctx.strokeStyle = '#33363e';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, rpmBaseY + 1); ctx.lineTo(W, rpmBaseY + 1); ctx.stroke();

      ctx.textAlign = 'center';
      ctx.font = `bold 11px ${FONT_UI}`;
      for (let n = 1; n <= 7; n++) {
        const nx = (n / 7) * (W - 22) + 6;
        ctx.fillStyle = n >= 6 ? '#f90000' : '#9aa3b2';
        ctx.fillText(String(n), nx, rpmBaseY + 13);
      }

      // =======================================================================
      // ZONA 2: MEIO HERO — 3 COLUNAS EQUILIBRADAS (SEM BURACO E SEM COLISÃO)
      // =======================================================================

      // COLUNA ESQUERDA (X = 12..136): Performance & Parcial
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 10.5px ${FONT_UI}`;
      ctx.fillText(state.simRunning ? '0–100 ATUAL' : 'MELHOR 0–100', 12, 98);
      ctx.fillStyle = state.simRunning ? '#1aff4c' : '#ffffff';
      ctx.font = `italic 900 22px ${FONT_NUM}`;
      ctx.fillText(
        state.simRunning ? `${state.timer0100.toFixed(2)}s` : `${state.best0100.toFixed(1)}s`,
        12, 118
      );

      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 10.5px ${FONT_UI}`;
      ctx.fillText('PICO RPM', 12, 134);
      ctx.fillStyle = '#ffffff';
      ctx.font = `italic 900 18px ${FONT_NUM}`;
      ctx.fillText(`${Math.round(state.peakRpm)}`, 12, 151);

      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 10px ${FONT_UI}`;
      ctx.fillText('PARCIAL', 12, 165);
      ctx.fillStyle = '#c8d0dc';
      ctx.font = `bold 13px ${FONT_UI}`;
      ctx.fillText(`${state.tripKm.toFixed(1)} km`, 62, 165);

      // Divisórias verticais ultra sutis para organizar o olhar dirigindo
      ctx.strokeStyle = '#1b1d22';
      ctx.beginPath(); ctx.moveTo(140, 88); ctx.lineTo(140, 174); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(278, 88); ctx.lineTo(278, 174); ctx.stroke();

      // COLUNA CENTRO (X = 140..278, centro = 209): MARCHA GIGANTE
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 13px ${FONT_UI}`;
      ctx.fillText('MARCHA', 209, 98);

      ctx.fillStyle = (isPeak && state.flash) ? '#f90000' : '#ffffff';
      ctx.font = `italic 900 84px ${FONT_NUM}`;
      ctx.fillText(state.gear === 0 ? 'N' : String(state.gear), 206, 172);

      // COLUNA DIREITA (X = 278..470): VELOCIDADE GIGANTE (com KM/H no topo — zero colisão com T.Ar!)
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 13px ${FONT_UI}`;
      ctx.fillText('VELOC.', 428, 98);
      ctx.fillStyle = '#9aa3b2';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText('KM/H', 468, 98);

      ctx.fillStyle = '#ffffff';
      ctx.font = `italic 900 84px ${FONT_NUM}`;
      ctx.fillText(String(state.speed), 468, 172);

      // Linha horizontal sutil separando o meio da telemetria inferior
      ctx.strokeStyle = '#22252b';
      ctx.beginPath(); ctx.moveTo(8, 181); ctx.lineTo(472, 181); ctx.stroke();

      // =======================================================================
      // ZONA 3: BASE — TODOS OS SENSORES REAIS DO POLO TRACK (5 COLUNAS)
      // =======================================================================

      // COL 1 (X = 10..84): T.Água (PID 0x05) + Carga Motor (PID 0x04)
      ctx.textAlign = 'left';
      ctx.fillStyle = isHot ? '#f90000' : '#ff9900';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText('T.ÁGUA', 10, 198);
      ctx.fillStyle = (isHot && state.flash) ? '#f90000' : (isHot ? '#ff4444' : '#ffffff');
      ctx.font = `italic 900 23px ${FONT_NUM}`;
      ctx.fillText(`${state.coolant.toFixed(1)}°`, 10, 221);

      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText('CARGA', 10, 241);
      ctx.fillStyle = '#00d4ff';
      ctx.font = `italic 900 22px ${FONT_NUM}`;
      ctx.fillText(`${state.load}%`, 10, 263);

      // COL 2 (X = 92..162): Barra Vertical MAP (PID 0x0B)
      drawVertBar(92, 202, 70, 62, 'MAP', state.mapBar.toFixed(2), (state.mapBar + 0.72) / 0.78, '#18e04b', ['-0.5', '-0.2', '0.0']);

      // COL 3 (X = 172..308, centro = 240): Avanço IGN (PID 0x0E) + Tanque (PID 0x2F)
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 11.5px ${FONT_UI}`;
      ctx.fillText('AVANÇO IGN', 240, 198);
      ctx.fillStyle = '#ffffff';
      ctx.font = `italic 900 26px ${FONT_NUM}`;
      ctx.fillText(`${state.ignDeg.toFixed(1)}°`, 240, 223);

      // Tanque com porcentagem exata + barra 4 segmentos (alerta reserva < 15%)
      ctx.textAlign = 'left';
      ctx.fillStyle = isLowFuel ? '#f90000' : '#ff9900';
      ctx.font = `bold 10.5px ${FONT_UI}`;
      ctx.fillText(isLowFuel ? 'RESERVA!' : 'TANQUE', 174, 243);
      ctx.textAlign = 'right';
      ctx.fillStyle = isLowFuel ? '#ff4444' : '#ffffff';
      ctx.font = `bold 10.5px ${FONT_UI}`;
      ctx.fillText(`${state.fuelPct}%`, 306, 243);

      const tx = 174, ty = 248, tw = 132, th = 16;
      ctx.fillStyle = '#1e2025';
      ctx.fillRect(tx, ty, tw, th);
      ctx.fillStyle = isLowFuel ? (state.flash ? '#f90000' : '#aa0000') : '#18e04b';
      ctx.fillRect(tx, ty, tw * (state.fuelPct / 100), th);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      for (let q = 1; q < 4; q++) {
        ctx.beginPath(); ctx.moveTo(tx + q * (tw / 4), ty); ctx.lineTo(tx + q * (tw / 4), ty + th); ctx.stroke();
      }
      ctx.strokeStyle = '#333740';
      ctx.lineWidth = 1;
      ctx.strokeRect(tx + 0.5, ty + 0.5, tw - 1, th - 1);

      // COL 4 (X = 318..388): Barra Vertical TPS % (PID 0x11)
      drawVertBar(318, 202, 70, 62, 'TPS', `${state.tps}%`, state.tps / 100, '#ff6600', ['25', '50', '75']);

      // COL 5 (X = 396..470): T.Ar IAT (PID 0x0F) + Bateria (PID 0x42)
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff9900';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText('T.AR IAT', 470, 198);
      ctx.fillStyle = '#ffffff';
      ctx.font = `italic 900 23px ${FONT_NUM}`;
      ctx.fillText(`${state.iat.toFixed(1)}°`, 470, 221);

      ctx.fillStyle = isLowBat ? '#f90000' : '#ff9900';
      ctx.font = `bold 11px ${FONT_UI}`;
      ctx.fillText('BATERIA', 470, 241);
      ctx.fillStyle = isLowBat ? (state.flash ? '#f90000' : '#ff5555') : '#18e04b';
      ctx.font = `italic 900 22px ${FONT_NUM}`;
      ctx.fillText(`${state.batV.toFixed(1)}V`, 470, 263);
    }

    // Simulação realista de puxada 0–100 km/h (1ª a 4ª marcha no Polo Track EA211)
    function stepSim(dt) {
      if (!state.simRunning) return;
      state.timer0100 += dt;
      if (state.gear === 0) state.gear = 1;

      const accel = { 1: 2450, 2: 1500, 3: 940, 4: 600, 5: 380 };
      const shiftRpm = state.mode === 'SPORT' ? 6550 : 3050;
      state.rpm += (accel[state.gear] || 500) * dt;
      state.tripKm += (state.speed / 3600) * dt;

      if (state.rpm >= shiftRpm) {
        if (state.gear < 4) {
          const v = state.rpm / MQ200_RATIOS[state.gear];
          state.gear++;
          state.rpm = Math.max(1900, v * MQ200_RATIOS[state.gear]);
          gearSelect.value = String(state.gear);
        } else {
          state.simRunning = false;
          btnSim.textContent = '▶ Puxada 0–100';
          state.gear = 3;
          state.rpm = 4200;
          gearSelect.value = '3';
        }
      }
      rpmSlider.value = String(Math.min(6800, Math.round(state.rpm)));
    }

    rpmSlider.addEventListener('input', () => {
      state.simRunning = false;
      btnSim.textContent = '▶ Puxada 0–100';
      state.rpm = Number(rpmSlider.value);
    });
    gearSelect.addEventListener('change', () => { state.gear = Number(gearSelect.value); });

    function toggleSim() {
      state.simRunning = !state.simRunning;
      if (state.simRunning) {
        state.gear = 1;
        state.rpm = 1500;
        state.timer0100 = 0;
        gearSelect.value = '1';
        btnSim.textContent = '■ Parar';
      } else {
        btnSim.textContent = '▶ Puxada 0–100';
      }
    }
    function toggleMode() {
      state.mode = state.mode === 'SPORT' ? 'ECO' : 'SPORT';
      btnMode.textContent = state.mode;
    }
    function toggleWarn() {
      state.warnTest = !state.warnTest;
      btnWarn.textContent = state.warnTest ? 'Alertas: ON' : 'Testar Alertas';
    }

    btnSim.addEventListener('click', toggleSim);
    btnMode.addEventListener('click', toggleMode);
    btnWarn.addEventListener('click', toggleWarn);
    // Toque no badge SPORT/ECO na tela alterna o modo
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (480 / rect.width);
      const y = (e.clientY - rect.top) * (272 / rect.height);
      if (x >= 145 && x <= 220 && y <= 35) toggleMode();
    });

    let last = performance.now(), fAcc = 0;
    function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      fAcc += dt;
      if (fAcc >= 0.085) { state.flash = !state.flash; fAcc = 0; }
      stepSim(dt);
      updateTelemetry();
      updateLeds();
      drawDashboard();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
